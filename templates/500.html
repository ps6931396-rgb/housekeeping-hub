{% extends "base.html" %}
{% block title %}Server Error — {{ site_settings.site_name }}{% endblock %}
{% block content %}
<section class="section error-section">
    <div class="container">
        <div class="error-code">500</div>
        <h2>Something Went Wrong</h2>
        <p>{{ message or "An unexpected error occurred on our end. Please try again later." }}</p>
        <a href="{{ url_for('public.index') }}" class="btn btn-primary btn-lg">Back to Home</a>
    </div>
</section>
{% endblock %}
