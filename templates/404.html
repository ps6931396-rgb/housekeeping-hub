{% extends "base.html" %}
{% block title %}Page Not Found — {{ site_settings.site_name }}{% endblock %}
{% block content %}
<section class="section error-section">
    <div class="container">
        <div class="error-code">404</div>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('public.index') }}" class="btn btn-primary btn-lg">Back to Home</a>
    </div>
</section>
{% endblock %}
