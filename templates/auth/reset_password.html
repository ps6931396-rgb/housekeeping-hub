{% extends "base.html" %}
{% block title %}Reset Password — {{ site_settings.site_name }}{% endblock %}

{% block content %}
<section class="auth-wrapper">
    <div class="container">
        <div class="auth-card glass-card" style="padding:2.4rem;" data-aos>
            <div class="auth-icon">🔒</div>
            <h1>Reset Your Password</h1>
            <p class="auth-sub">Choose a new password for your account.</p>

            <form method="POST" action="{{ url_for('customer.reset_password', token=token) }}" class="app-form" data-form="register">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <div class="input-wrap">
                        <input type="password" id="password" name="password" minlength="6" required autofocus>
                        <button type="button" class="password-toggle">👁️</button>
                    </div>
                    <small>Minimum 6 characters</small>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <div class="input-wrap">
                        <input type="password" id="confirm_password" name="confirm_password" minlength="6" required>
                        <button type="button" class="password-toggle">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">Reset Password</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
