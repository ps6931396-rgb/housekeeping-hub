{% extends "base.html" %}
{% block title %}Admin Login — {{ site_settings.site_name }}{% endblock %}

{% block content %}
<section class="auth-wrapper">
    <div class="container">
        <div class="auth-card glass-card" style="padding:2.4rem; border-top:3px solid var(--secondary);" data-aos>
            <div class="auth-icon" style="background: linear-gradient(135deg, var(--secondary), var(--primary));">🛡️</div>
            <h1>Admin Login</h1>
            <p class="auth-sub">Restricted access — administrators only.</p>

            <form method="POST" action="{{ url_for('admin.admin_login') }}" class="app-form">
                <div class="form-group">
                    <label for="email">Admin Email</label>
                    <input type="email" id="email" name="email" value="{{ form.email or '' }}" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="password-toggle">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">Login as Admin</button>
            </form>

            <p class="auth-footer"><a href="{{ url_for('customer.login') }}">&larr; Back to Customer Login</a></p>
        </div>
    </div>
</section>
{% endblock %}
