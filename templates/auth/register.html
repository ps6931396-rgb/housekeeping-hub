{% extends "base.html" %}
{% block title %}Create Account — {{ site_settings.site_name }}{% endblock %}

{% block content %}
<section class="auth-wrapper">
    <div class="container">
        <div class="auth-card glass-card" style="padding:2.4rem;" data-aos>
            <div class="auth-icon">👤</div>
            <h1>Create Your Account</h1>
            <p class="auth-sub">Register to book services and track your bookings.</p>

            <form method="POST" action="{{ url_for('customer.register') }}" class="app-form" data-form="register">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" value="{{ form.name or '' }}" required autofocus>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" value="{{ form.email or '' }}" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone (optional)</label>
                        <input type="tel" id="phone" name="phone" value="{{ form.phone or '' }}">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="password" name="password" minlength="6" required>
                        <button type="button" class="password-toggle">👁️</button>
                    </div>
                    <small>Minimum 6 characters</small>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <div class="input-wrap">
                        <input type="password" id="confirm_password" name="confirm_password" minlength="6" required>
                        <button type="button" class="password-toggle">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
            </form>

            <p class="auth-footer">Already have an account? <a href="{{ url_for('customer.login') }}">Login here</a></p>
        </div>
    </div>
</section>
{% endblock %}
