{% extends "customer/base_customer.html" %}
{% block title %}Change Password — {{ site_settings.site_name }}{% endblock %}

{% block dashboard_content %}
<div class="table-card-header"><h2>Change Password</h2></div>

<div class="dashboard-card" style="max-width:520px;">
    <form method="POST" action="{{ url_for('customer.change_password') }}" class="app-form" data-form="register">
        <div class="form-group">
            <label for="current_password">Current Password</label>
            <div class="input-wrap">
                <input type="password" id="current_password" name="current_password" required>
                <button type="button" class="password-toggle">👁️</button>
            </div>
        </div>
        <div class="form-group">
            <label for="new_password">New Password</label>
            <div class="input-wrap">
                <input type="password" id="new_password" name="new_password" minlength="6" required>
                <button type="button" class="password-toggle">👁️</button>
            </div>
            <small>Minimum 6 characters</small>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <div class="input-wrap">
                <input type="password" id="confirm_password" name="confirm_password" minlength="6" required>
                <button type="button" class="password-toggle">👁️</button>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Update Password</button>
    </form>
</div>
{% endblock %}
